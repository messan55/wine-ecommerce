services:
  postgres:
    image: postgres:16-alpine
    container_name: cave-solive-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: cave
      POSTGRES_PASSWORD: cave
      POSTGRES_DB: cave
    ports:
      - "5432:5432"
    volumes:
      - cave_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cave -d cave"]
      interval: 3s
      timeout: 5s
      retries: 20

volumes:
  cave_postgres:
